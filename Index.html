<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Síntesis Curricular Félix Sánchez</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- PANTALLA DE ACCESO POR CONTRASEÑA -->
    <div id="pantalla-bloqueo">
        <div class="tarjeta-bloqueo">
            <div class="icono-candado">&#128274;</div>
            <h2>Acceso Restringido</h2>
            <p>Introduce la contraseña para ver el currículum vitae y certificaciones.</p>

            <form onsubmit="verificarClave(event)">
                <input type="password" id="input-clave" placeholder="Ingresa la contraseña..." autofocus required>
                <button type="submit">Ingresar</button>
            </form>
            <p id="mensaje-error" class="error-oculto">⚠️ Contraseña incorrecta</p>
        </div>
    </div>

    <script>
        // Define la contraseña que desees:
        const CLAVE_CORRECTA = "CVS@NCHEZ123";

        function verificarClave(e) {
            e.preventDefault();
            const input = document.getElementById("input-clave").value;
            const error = document.getElementById("mensaje-error");

            if (input === CLAVE_CORRECTA) {
                // Guarda la autorización para la sesión actual
                sessionStorage.setItem("acceso_autorizado", "true");
                // Redirige al currículum
                window.location.href = "CV.html";
            } else {
                error.classList.remove("error-oculto");
            }
        }
    </script>
</body>

</html>
